<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velthoric API - Documentation</title>
    <!-- Google Fonts for better typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- External CSS for styling -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/velthoric_icon.png" />
</head>
<body>

<!-- Sidebar for navigation -->
<aside id="sidebar">
    <div class="sidebar-header">
        <h2 class="logo">Velthoric API</h2>
    </div>
    <nav id="sidebar-nav">
        <p>Loading navigation...</p>
    </nav>
</aside>

<!-- Main content area -->
<div class="main-view">
    <header>
        <div class="header-content">
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">
                <i data-lucide="menu"></i>
            </button>
            <div id="version-selector-container">
                <!-- Version selector will be injected here by JavaScript -->
            </div>
        </div>
    </header>

    <main id="content">
        <div class="content-wrapper">
            <p>Loading content...</p>
        </div>
    </main>
</div>

<!-- External JavaScript libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- Lucide icons for a clean icon set -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Custom JavaScript for application logic -->
<script src="js/app.js"></script>

</body>
</html>
