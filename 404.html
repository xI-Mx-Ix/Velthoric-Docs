<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Velthoric API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/velthoric_icon.png" />
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex items-center justify-center p-6">

<div class="max-w-md w-full text-center">
    <!-- Icon -->
    <div class="w-24 h-24 mx-auto bg-slate-900 rounded-full flex items-center justify-center mb-6 border border-slate-800 shadow-xl shadow-cyan-500/5 relative group">
        <div class="absolute inset-0 bg-cyan-500/20 rounded-full blur-xl opacity-0 group-hover:opacity-100 transition duration-500"></div>
        <i class="fas fa-compass text-4xl text-slate-500 group-hover:text-cyan-400 transition duration-300"></i>
    </div>

    <!-- Error Message -->
    <h1 class="text-6xl font-bold text-white mb-2 tracking-tighter">404</h1>
    <h2 class="text-xl font-semibold text-slate-400 mb-6">Page Not Found</h2>

    <p class="text-slate-500 mb-8 leading-relaxed">
        The documentation page you are looking for might have been moved, renamed, or is temporarily unavailable.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button onclick="history.back()" class="px-6 py-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium transition flex items-center justify-center gap-2">
            <i class="fas fa-arrow-left text-xs"></i> Go Back
        </button>

        <a href="index.html" class="px-6 py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold shadow-lg shadow-cyan-500/20 transition flex items-center justify-center gap-2">
            <i class="fas fa-home text-xs"></i> Documentation Home
        </a>
    </div>
</div>

</body>
</html>
